name: Windows client test package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run validate:locales
      - run: node scripts/validate-atlas.mjs
      - run: node scripts/validate-interactions.mjs
      - run: npm run build
      - run: npm run build:client
      - run: npm run validate:client
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run client:build
      - uses: actions/upload-artifact@v4
        with:
          name: Human-Atlas-Windows-x64-test
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
